[run]
seed = 42
k = 10
queries = 10
# Applies to every target with a search knob. 1000 = dataset.rows: the full-candidate endpoint.
search_values = [20, 80, 320, 1000]
# Matched-recall operating point: scenario C reports the lowest knob reaching it.
recall_threshold = 0.94
output = "results_smoke.json"

[dataset]
name = "synthetic-smoke"
rows = 1000
dims = 16
# A row passes when bucket < round(selectivity * 100). Fixtures are stratified, so the realized
# pass rate equals the configured selectivity to within one row (recorded as pass_rate).
selectivities = [0.01, 0.05, 0.10]
fixtures = ["correlated", "uncorrelated"]

[methodology]
profile = "filtered-ann"
adversarial_axis = "selectivity x filter/geometry correlation"

[postgres_sql]
dsn = "postgresql://postgres:postgres@localhost:5432/postgres"
setup_sql = [
  "DROP TABLE IF EXISTS {table}",
  "CREATE TABLE {table} ({id_column} int PRIMARY KEY, {vector_column} text, {filter_column} int)"
]
insert_sql = "INSERT INTO {table} ({id_column}, {vector_column}, {filter_column}) VALUES (%s, %s, %s)"
insert_params = ["id", "query_vector", "filter_value"]
after_load_sql = ["ANALYZE {table}"]
# Template only: replace ORDER BY with your extension's distance ordering (for example
# `{vector_column} <-> %s`) and add "query_vector" to query_params at the matching position.
query_sql = """
SELECT {id_column}
FROM {table}
WHERE {filter_column} < %s
ORDER BY {id_column}
LIMIT %s
"""
query_params = ["filter_value", "k"]
# Without set_search_knob_sql the target has no knob and each cell runs once.
# set_search_knob_sql = "SET my_extension.ef_search = %s"
teardown_sql = ["DROP TABLE IF EXISTS {table}"]

[postgres_sql.context]
table = "bench_items"
id_column = "id"
vector_column = "embedding_payload"
filter_column = "category"

[targets.postgres_sql]
module = "targets.postgres_sql"
enabled = false

[targets.prefilter_exact]
module = "targets.prefilter_exact"
enabled = true

[targets.postfilter_topn]
module = "targets.postfilter_topn"
enabled = true
